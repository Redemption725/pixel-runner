<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>霓虹疾行 · Neon Rush 3D</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='4' width='24' height='24' rx='6' fill='%23120726'/%3E%3Crect x='9' y='9' width='5' height='14' fill='%2322d3ee'/%3E%3Crect x='18' y='9' width='5' height='14' fill='%23ff2e88'/%3E%3C/svg%3E">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0a0618;
    font-family:"Consolas","SF Mono","PingFang SC","Microsoft YaHei",monospace; color:#fff; }
  #game-wrap { position:fixed; inset:0; overflow:hidden; user-select:none; touch-action:none; }
  canvas#game { position:absolute; inset:0; display:block; }

  /* HUD */
  #hud { position:absolute; top:0; left:0; right:0; z-index:7;
    padding:calc(10px + env(safe-area-inset-top)) 12px 0; display:flex; justify-content:space-between; align-items:flex-start; }
  .hud-box { background:rgba(12,6,30,.62); border:1.5px solid rgba(34,211,238,.55); border-radius:10px;
    padding:8px 14px; line-height:1.45; backdrop-filter:blur(6px);
    box-shadow:0 0 18px rgba(34,211,238,.25), inset 0 0 12px rgba(255,46,136,.12); }
  #dist { font-size:19px; font-weight:bold; color:#7df9ff; letter-spacing:1px; text-shadow:0 0 10px rgba(34,211,238,.8); }
  #coins { font-size:14px; color:#ffd23f; font-weight:bold; text-shadow:0 0 8px rgba(255,210,63,.7); }
  #btn-pause { width:46px; height:46; border-radius:11px; background:rgba(12,6,30,.62);
    border:1.5px solid rgba(255,46,136,.6); display:flex; align-items:center; justify-content:center;
    touch-action:none; box-shadow:0 0 16px rgba(255,46,136,.3); }
  #btn-pause:active { background:rgba(255,46,136,.25); }
  #btn-pause svg { width:20px; height:20px; fill:#ffb3d9; }

  /* 覆盖面板 */
  #overlay { position:absolute; inset:0; z-index:10; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at center,rgba(30,10,60,.72),rgba(5,2,15,.9)); padding:20px; }
  #overlay.hidden { display:none; }
  .panel { width:100%; max-width:440px; max-height:92vh; overflow-y:auto; text-align:center;
    background:linear-gradient(160deg,rgba(28,14,58,.92),rgba(12,6,30,.94));
    border:1.5px solid rgba(125,249,255,.4); border-radius:18px; padding:30px 26px;
    box-shadow:0 0 40px rgba(34,211,238,.25), 0 0 70px rgba(255,46,136,.18), inset 0 0 24px rgba(125,249,255,.06); }
  .panel h1 { font-size:32px; font-weight:900; letter-spacing:3px;
    background:linear-gradient(90deg,#22d3ee,#a78bfa,#ff2e88); -webkit-background-clip:text; background-clip:text; color:transparent;
    margin-bottom:6px; filter:drop-shadow(0 0 14px rgba(34,211,238,.5)); }
  .panel .sub { font-size:11px; color:#9d8bd6; letter-spacing:5px; margin-bottom:22px; }
  .panel p.help { font-size:13px; line-height:2.05; text-align:left;
    background:rgba(0,0,0,.32); border:1px solid rgba(167,139,250,.25); border-radius:12px;
    padding:15px 17px; margin-bottom:22px; color:#e7e0ff; }
  .panel p.help b { color:#7df9ff; }
  .panel p.help .y { color:#ffd23f; }
  .big-btn { width:100%; padding:16px; border:none; border-radius:12px; font-size:17px; font-weight:900;
    letter-spacing:4px; color:#06121a; cursor:pointer; background:linear-gradient(90deg,#22d3ee,#67e8f9);
    box-shadow:0 5px 0 #0e7490, 0 0 22px rgba(34,211,238,.5); transition:transform .08s; }
  .big-btn:active { transform:translateY(4px); box-shadow:0 1px 0 #0e7490; }
  .big-btn.alt { margin-top:12px; background:linear-gradient(90deg,#ff2e88,#fb7185); color:#2a0414;
    box-shadow:0 5px 0 #be185d, 0 0 22px rgba(255,46,136,.5); }
  #end-stats { font-size:16px; line-height:2; margin:6px 0 22px; color:#fff; }
  #end-stats .big { font-size:28px; color:#7df9ff; font-weight:bold; text-shadow:0 0 12px rgba(34,211,238,.7); }
  #new-record { color:#ffd23f; font-weight:bold; margin-bottom:12px; letter-spacing:3px; display:none;
    text-shadow:0 0 12px rgba(255,210,63,.8); }
  #pause-btns { display:flex; gap:12px; }
  #pause-btns .big-btn { margin:0; }
  #pause-btns .alt { margin:0; }
</style>
</head>
<body>
<div id="game-wrap">
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="hud-box">
      <div id="dist">0 m</div>
      <div id="coins">● 0</div>
    </div>
    <button id="btn-pause" aria-label="暂停">
      <svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
    </button>
  </div>

  <div id="overlay">
    <!-- 开始 -->
    <div class="panel" id="panel-start">
      <h1>霓虹疾行 3D</h1>
      <div class="sub">NEON RUSH</div>
      <p class="help">
        <b>电脑：</b>← → / A D 换道，↑ / W / 空格 跳跃，↓ / S 下滑，P 暂停。<br>
        <b>手机：</b>左右滑动换道，上滑跳跃，下滑翻滚；点屏也可跳跃。<br>
        <span class="y">●</span> 收集发光金币；跳过矮障、下滑穿过高杆；<br>
        <b style="color:#fb7185">立体列车无法跳跃，必须提前换道！</b>
      </p>
      <button class="big-btn" id="btn-start">开始疾行</button>
    </div>

    <!-- 暂停 -->
    <div class="panel" id="panel-pause" style="display:none">
      <h1 style="font-size:27px">已暂停</h1>
      <div class="sub">PAUSED</div>
      <div id="pause-btns">
        <button class="big-btn" id="btn-resume">继续</button>
        <button class="big-btn alt" id="btn-restart-p">重开</button>
      </div>
    </div>

    <!-- 结束 -->
    <div class="panel" id="panel-over" style="display:none">
      <h1 style="font-size:27px">撞上了！</h1>
      <div id="new-record">★ 新纪录 ★</div>
      <div id="end-stats">
        疾行距离 <span class="big" id="end-dist">0</span> m<br>
        收集金币 <span id="end-coins">0</span> 枚<br>
        最远纪录 <span id="end-high">0</span> m
      </div>
      <button class="big-btn" id="btn-retry">再来一次</button>
    </div>
  </div>
</div>

<!-- Three.js r147 UMD（主库 + 后处理，顺序不可调换） -->
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js" integrity="sha384-vV17nr/rMaJqmeZkFUzXLpHdQ+ME5QHKdydaqqN+3Ga39RJlNrTatJxHwGV4ml2C" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

<script>
/* =====================================================================
   霓虹疾行 Neon Rush —— Three.js 真 3D 三车道跑酷
   坐标：玩家 z=0；相机在 z 负、y 高处朝 +z；障碍在 +z 远处生成并逼近。
   ===================================================================== */
(function () {
  'use strict';
  function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
  function rand(a,b){ return a+Math.random()*(b-a); }
  function randInt(a,b){ return a+Math.floor(Math.random()*(b-a+1)); }
  function loadNum(k,d){ try{var v=parseInt(localStorage.getItem(k),10);return isNaN(v)?d:v;}catch(e){return d;} }
  function saveNum(k,v){ try{localStorage.setItem(k,String(v));}catch(e){} }

  var LANE_X=[-2.4,0,2.4];
  var G = { state:'start', totalDist:0, coins:0, high:loadNum('neon_rush_high',0),
    speed:13, player:null, objs:[], scenery:[], parts:[],
    spawnCursor:20, laneFreeAt:[0,0,0], pool:{}, bloom:null, composer:null };

  /* ================= 渲染器 / 场景 / 相机 ================= */
  var renderer=new THREE.WebGLRenderer({canvas:document.getElementById('game'),antialias:true,powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.outputEncoding=THREE.sRGBEncoding;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.12;

  var scene=new THREE.Scene();
  scene.background=new THREE.Color(0x0a0618);
  scene.fog=new THREE.Fog(0x0a0618,28,92);

  var camera=new THREE.PerspectiveCamera(62,1,0.1,220);
  var CAM_Z=-7.6, CAM_Y=4.7;
  camera.position.set(0,CAM_Y,CAM_Z);
  camera.lookAt(0,1.6,12);

  /* ================= 灯光 ================= */
  scene.add(new THREE.HemisphereLight(0x4a3b8f,0x0a0716,0.75));
  scene.add(new THREE.AmbientLight(0x39306b,0.5));
  var sun=new THREE.DirectionalLight(0xbfa7ff,1.15);
  sun.position.set(6,14,-4);
  sun.castShadow=true;
  sun.shadow.mapSize.set(2048,2048);
  sun.shadow.camera.near=1; sun.shadow.camera.far=70;
  sun.shadow.camera.left=-12; sun.shadow.camera.right=12;
  sun.shadow.camera.top=18; sun.shadow.camera.bottom=-14;
  sun.shadow.bias=-0.0006;
  scene.add(sun);
  // 霓虹补光（青/品红）
  var pCyan=new THREE.PointLight(0x22d3ee,1.4,30); pCyan.position.set(-6,4,-2); scene.add(pCyan);
  var pPink=new THREE.PointLight(0xff2e88,1.2,30); pPink.position.set(6,4,2); scene.add(pPink);

  /* ================= 程序化窗户纹理 ================= */
  function windowTexture(lit){
    var c=document.createElement('canvas'); c.width=64; c.height=128;
    var g=c.getContext('2d');
    g.fillStyle='#0c0820'; g.fillRect(0,0,64,128);
    for(var y=5;y<124;y+=9) for(var x=4;x<60;x+=8){
      if(Math.random()<0.45){ g.fillStyle=lit; g.fillRect(x,y,4,5); }
    }
    var t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding; return t;
  }
  var winTex=[windowTexture('#22d3ee'),windowTexture('#ff2e88'),windowTexture('#a78bfa'),windowTexture('#ffd23f')];

  /* ================= 固定场景：地面 / 铁轨 ================= */
  // 地面
  var ground=new THREE.Mesh(new THREE.PlaneGeometry(60,260),
    new THREE.MeshStandardMaterial({color:0x120d26,roughness:0.95,metalness:0.05}));
  ground.rotation.x=-Math.PI/2; ground.position.set(0,-0.02,70); ground.receiveShadow=true; scene.add(ground);
  // 轨道基座（略亮条带）
  var bed=new THREE.Mesh(new THREE.BoxGeometry(8.2,0.12,240),
    new THREE.MeshStandardMaterial({color:0x1b1538,roughness:0.9}));
  bed.position.set(0,0.02,70); bed.receiveShadow=true; scene.add(bed);
  // 钢轨（每条车道两条，金属）
  var railMat=new THREE.MeshStandardMaterial({color:0x9aa4c8,metalness:0.95,roughness:0.28});
  for(var l=0;l<3;l++) for(var s=-1;s<=1;s+=2){
    var rail=new THREE.Mesh(new THREE.BoxGeometry(0.13,0.13,240),railMat);
    rail.position.set(LANE_X[l]+s*0.55,0.12,70); scene.add(rail);
  }
  // 两侧霓虹道边线
  var edgeGeo=new THREE.BoxGeometry(0.1,0.1,240);
  var edgeL=new THREE.Mesh(edgeGeo,new THREE.MeshStandardMaterial({color:0x22d3ee,emissive:0x22d3ee,emissiveIntensity:1.6}));
  edgeL.position.set(-4.2,0.18,70); scene.add(edgeL);
  var edgeR=new THREE.Mesh(edgeGeo,new THREE.MeshStandardMaterial({color:0xff2e88,emissive:0xff2e88,emissiveIntensity:1.6}));
  edgeR.position.set(4.2,0.18,70); scene.add(edgeR);

  /* ================= 玩家（低多边形小人） ================= */
  function makePlayer(){
    var g=new THREE.Group();
    var suit=new THREE.MeshStandardMaterial({color:0x22d3ee,roughness:0.5,metalness:0.2,emissive:0x0b3a44,emissiveIntensity:.5});
    var dark=new THREE.MeshStandardMaterial({color:0x1a1040,roughness:.7});
    var skin=new THREE.MeshStandardMaterial({color:0xffcf9e,roughness:.8});
    // 躯干
    var body=new THREE.Mesh(new THREE.BoxGeometry(0.82,1.0,0.5),suit); body.position.y=1.25; body.castShadow=true; g.add(body);
    // 腰带
    var belt=new THREE.Mesh(new THREE.BoxGeometry(.86,.18,.54),dark); belt.position.y=.78; g.add(belt);
    // 头
    var head=new THREE.Mesh(new THREE.BoxGeometry(0.6,0.6,0.6),skin); head.position.y=2.02; head.castShadow=true; g.add(head);
    // 头盔/帽
    var helm=new THREE.Mesh(new THREE.BoxGeometry(0.66,0.3,0.66),new THREE.MeshStandardMaterial({color:0xff2e88,emissive:0x6a0f2e,emissiveIntensity:.6}));
    helm.position.y=2.42; g.add(helm);
    // 手臂
    var armGeo=new THREE.BoxGeometry(0.22,0.85,0.22);
    var armL=new THREE.Mesh(armGeo,suit); armL.position.set(-0.58,1.35,0); armL.castShadow=true; g.add(armL);
    var armR=new THREE.Mesh(armGeo,suit); armR.position.set(0.58,1.35,0); armR.castShadow=true; g.add(armR);
    // 腿
    var legGeo=new THREE.BoxGeometry(0.28,0.78,0.28);
    var legL=new THREE.Mesh(legGeo,dark); legL.position.set(-0.22,0.4,0); legL.castShadow=true; g.add(legL);
    var legR=new THREE.Mesh(legGeo,dark); legR.position.set(0.22,0.4,0); legR.castShadow=true; g.add(legR);
    g.userData={armL:armL,armR:armR,legL:legL,legR:legR,body:body,head:head};
    g.position.set(LANE_X[1],0,0);
    scene.add(g);
    return {group:g,lane:1,x:LANE_X[1],y:0,vy:0,sliding:0,runT:0};
  }

  /* ================= 对象池 ================= */
  function take(key,build){
    var arr=G.pool[key]; if(arr&&arr.length) return arr.pop();
    return build();
  }
  function release(key,mesh){
    scene.remove(mesh); (G.pool[key]=G.pool[key]||[]).push(mesh);
  }

  /* ================= 物体建造 ================= */
  function buildCoin(){
    var grp=new THREE.Group();
    var m=new THREE.Mesh(new THREE.CylinderGeometry(0.42,0.42,0.12,20),
      new THREE.MeshStandardMaterial({color:0xffd23f,metalness:0.85,roughness:0.25,emissive:0x8a6a00,emissiveIntensity:.7}));
    m.rotation.x=Math.PI/2; m.castShadow=true; grp.add(m);
    return grp;
  }
  function buildLow(){
    var grp=new THREE.Group();
    var box=new THREE.Mesh(new THREE.BoxGeometry(1.7,0.85,0.6),
      new THREE.MeshStandardMaterial({color:0xfb923c,emissive:0x7a2e00,emissiveIntensity:.4,roughness:.6}));
    box.position.y=.45; box.castShadow=true; grp.add(box);
    var stripe=new THREE.Mesh(new THREE.BoxGeometry(1.74,.2,.62),
      new THREE.MeshStandardMaterial({color:0xffffff,emissive:0x444444,emissiveIntensity:.4}));
    stripe.position.y=.55; grp.add(stripe);
    return grp;
  }
  function buildHigh(){
    var grp=new THREE.Group();
    var poleMat=new THREE.MeshStandardMaterial({color:0x8d85c9,roughness:.5,metalness:.4});
    var p1=new THREE.Mesh(new THREE.BoxGeometry(.16,2.4,.16),poleMat); p1.position.set(-.95,1.2,0); grp.add(p1);
    var p2=p1.clone(); p2.position.x=.95; grp.add(p2);
    var bar=new THREE.Mesh(new THREE.BoxGeometry(2.06,.22,.22),
      new THREE.MeshStandardMaterial({color:0xffd23f,emissive:0x8a6a00,emissiveIntensity:.8}));
    bar.position.y=1.85; bar.castShadow=true; grp.add(bar);
    return grp;
  }
  var TRAIN_COLORS=[0xe63946,0x3a86ff,0x9b5de5,0x06d6a0];
  var TLEN=10;                 // 列车长度（视觉=碰撞，近端在局部 z=0，向 +z 延伸）
  function buildTrain(){
    var grp=new THREE.Group();
    var col=TRAIN_COLORS[randInt(0,TRAIN_COLORS.length-1)];
    var bodyMat=new THREE.MeshStandardMaterial({color:col,roughness:.45,metalness:.25});
    var body=new THREE.Mesh(new THREE.BoxGeometry(1.9,2.7,TLEN),bodyMat);
    body.position.set(0,1.45,TLEN/2); body.castShadow=true; grp.add(body);
    // 车顶
    var roof=new THREE.Mesh(new THREE.BoxGeometry(1.7,.22,TLEN),
      new THREE.MeshStandardMaterial({color:0x1a1030,roughness:.7}));
    roof.position.set(0,2.9,TLEN/2); grp.add(roof);
    // 侧面发光车窗（整条）
    var swMat=new THREE.MeshStandardMaterial({color:0x06202a,emissive:0x22d3ee,emissiveIntensity:1,metalness:.6,roughness:.2});
    for(var sx=-1;sx<=1;sx+=2){
      var sw=new THREE.Mesh(new THREE.BoxGeometry(.08,.7,TLEN-2.5),swMat);
      sw.position.set(sx*.96,1.95,TLEN/2); grp.add(sw);
    }
    // 车头（近端 z=0）
    var nose=new THREE.Mesh(new THREE.BoxGeometry(1.95,2.75,.4),
      new THREE.MeshStandardMaterial({color:col,roughness:.4,metalness:.3}));
    nose.position.set(0,1.45,.15); nose.castShadow=true; grp.add(nose);
    // 车头灯
    var lampMat=new THREE.MeshStandardMaterial({color:0xffffff,emissive:0xfff2b0,emissiveIntensity:1.5});
    var hl1=new THREE.Mesh(new THREE.BoxGeometry(.35,.28,.12),lampMat); hl1.position.set(-.55,1,.02); grp.add(hl1);
    var hl2=hl1.clone(); hl2.position.x=.55; grp.add(hl2);
    return grp;
  }

  /* ================= 生成波次（保证每条车道可通行） =================
     laneFreeAt[lane]：该车道“上一列车远端”所在世界 z；新车近端 z 必须
     与其保持 MIN_GAP 以上，从根本上杜绝同车道连续列车堵死。 */
  var MIN_GAP=10;
  function canTrain(lane,z){ return z >= G.laneFreeAt[lane]+MIN_GAP; }
  function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){var j=randInt(0,i),t=a[i];a[i]=a[j];a[j]=t;} return a; }
  function spawnWave(z){
    var r=Math.random(), want=(r<.55)?2:((r<.78)?1:0), trainLanes=[];
    if(want===2){
      // 随机选一条“安全车道”，其余两条放车（都满足间距才成立）
      var order=shuffle([0,1,2]);
      for(var s=0;s<order.length;s++){
        var safe=order[s], others=[0,1,2].filter(function(x){return x!==safe;});
        if(canTrain(others[0],z)&&canTrain(others[1],z)){ trainLanes=others; break; }
      }
    }
    // 双车不满足条件，或本就想要单车：放一辆满足间距的列车
    if(trainLanes.length===0 && want>=1){
      var c=[0,1,2].filter(function(x){return canTrain(x,z);});
      if(c.length) trainLanes=[c[randInt(0,c.length-1)]];
    }
    for(var t=0;t<trainLanes.length;t++){
      var tr=take('train',buildTrain);
      tr.position.set(LANE_X[trainLanes[t]],0,z);
      scene.add(tr);
      G.objs.push({type:'train',lane:trainLanes[t],z:z,len:TLEN,mesh:tr});
      G.laneFreeAt[trainLanes[t]]=z+TLEN;
    }
    for(var l=0;l<3;l++){
      if(trainLanes.indexOf(l)>=0) continue;
      var rr=Math.random();
      if(rr<.42){
        for(var k=0;k<4;k++){
          var c=take('coin',buildCoin);
          c.position.set(LANE_X[l],1.25,z+k*2.4);
          scene.add(c);
          G.objs.push({type:'coin',lane:l,z:z+k*2.4,mesh:c});
        }
      } else if(rr<.6){
        var lw=take('low',buildLow); lw.position.set(LANE_X[l],0,z); scene.add(lw);
        G.objs.push({type:'low',lane:l,z:z,mesh:lw});
      } else if(rr<.76){
        var hg=take('high',buildHigh); hg.position.set(LANE_X[l],0,z); scene.add(hg);
        G.objs.push({type:'high',lane:l,z:z,mesh:hg});
      }
    }
  }

  /* ================= 场景装饰：枕木 / 高楼 ================= */
  function initScenery(){
    // 枕木（对象池式循环）
    G.ties=[];
    var tieMat=new THREE.MeshStandardMaterial({color:0x241a48,roughness:.9});
    for(var i=0;i<26;i++){
      var tie=new THREE.Mesh(new THREE.BoxGeometry(7.6,.1,.42),tieMat);
      tie.position.set(0,0.06,i*1.55); tie.receiveShadow=true; scene.add(tie); G.ties.push(tie);
    }
    // 高楼
    G.blds=[];
    for(i=0;i<12;i++){
      var side=i%2?1:-1, h=rand(16,40), dep=rand(7,12);
      var b=new THREE.Mesh(new THREE.BoxGeometry(rand(7,10),h,dep),
        new THREE.MeshStandardMaterial({map:winTex[randInt(0,3)],roughness:.85,metalness:.15}));
      b.position.set(side*rand(12,15),h/2-0.5,i*16-10);
      b.userData.side=side; scene.add(b); G.blds.push(b);
    }
  }
  function updateScenery(dt){
    var move=G.speed*dt;
    for(var i=0;i<G.ties.length;i++){ var t=G.ties[i]; t.position.z-=move; if(t.position.z<-3) t.position.z+=26*1.55; }
    for(i=0;i<G.blds.length;i++){ var b=G.blds[i]; b.position.z-=move; if(b.position.z<-16){ b.position.z+=12*16; b.position.x=b.userData.side*rand(12,15); } }
  }

  /* ================= 碰撞 / 更新物体 ================= */
  function sameLane(o){ return Math.abs(o.mesh.position.x-G.player.x)<1.15; }
  function updateObjs(dt){
    G.spawnCursor-=G.speed*dt;
    if(G.spawnCursor<=0){ spawnWave(92); G.spawnCursor=15; }
    var p=G.player;
    for(var i=G.objs.length-1;i>=0;i--){
      var o=G.objs[i], prev=o.z;
      o.z-=G.speed*dt; o.mesh.position.z=o.z;
      if(o.type==='coin') o.mesh.rotation.y+=dt*3.2;
      if(o.type==='train'){
        if(prev>0&&o.z<=0){ if(o.z+o.len>=0&&sameLane(o)) crash(); }
        if(o.z+o.len<-8){ release('train',o.mesh); G.objs.splice(i,1); }
        continue;
      }
      if(prev>0&&o.z<=0){
        if(o.type==='coin'){ if(sameLane(o)){ G.coins++; G.totalDist+=4; } }
        else if(o.type==='low'){ if(sameLane(o)&&p.y<0.95) crash(); }
        else if(o.type==='high'){ if(sameLane(o)&&p.sliding<=0) crash(); }
      }
      if(o.z<-8){ release(o.type,o.mesh); G.objs.splice(i,1); }
    }
  }

  /* ================= 玩家更新 ================= */
  function moveLane(d){ G.player.lane=clamp(G.player.lane+d,0,2); }
  function doJump(){ var p=G.player; if(p.sliding>0)p.sliding=0; if(p.y===0&&p.vy===0)p.vy=9.2; }
  function doSlide(){ var p=G.player; if(p.y>0||p.vy>0){p.y=0;p.vy=0;} p.sliding=.58; }
  function updatePlayer(dt){
    var p=G.player, g=p.group;
    // 换道平滑
    var tx=LANE_X[p.lane], dx=tx-p.x, step=G.speed*0.28*dt+3.2*dt;
    if(Math.abs(dx)<=step) p.x=tx; else p.x+=(dx>0?step:-step);
    // 跳跃
    if(p.vy>0||p.y>0){ p.y+=p.vy*dt; p.vy-=23*dt; if(p.y<=0){p.y=0;p.vy=0;} }
    if(p.sliding>0) p.sliding-=dt;
    // 应用位置
    g.position.x=p.x;
    var slideP=p.sliding>0;
    g.position.y=p.y;
    g.scale.set(1,slideP?0.5:1,slideP?1.25:1);
    // 跑步/跳跃动画
    p.runT+=dt*(6+G.speed*.35);
    var u=g.userData;
    if(p.y>0){ // 跳跃：腿收起、手上抬
      u.legL.rotation.x=-.7; u.legR.rotation.x=.5; u.armL.rotation.x=-.9; u.armR.rotation.x=-1.1;
    } else if(slideP){
      u.legL.rotation.x=0; u.legR.rotation.x=0; u.armL.rotation.x=0; u.armR.rotation.x=0;
    } else {
      var sw=Math.sin(p.runT);
      u.legL.rotation.x=sw*.9; u.legR.rotation.x=-sw*.9;
      u.armL.rotation.x=-sw*.8; u.armR.rotation.x=sw*.8;
    }
    // 相机跟随
    camera.position.x=p.x*.32;
    camera.position.y=CAM_Y+p.y*.28;
    camera.lookAt(p.x*.32,1.5+p.y*.25,12);
  }

  /* ================= 撞击粒子 ================= */
  function explode(x,y,z){
    var cols=[0xffd23f,0xff2e88,0x22d3ee,0xffffff];
    for(var i=0;i<22;i++){
      var m=new THREE.Mesh(new THREE.BoxGeometry(.22,.22,.22),
        new THREE.MeshStandardMaterial({color:cols[randInt(0,3)],emissive:cols[randInt(0,3)],emissiveIntensity:.8}));
      m.position.set(x,y,z);
      m.userData={vx:rand(-6,6),vy:rand(2,11),vz:rand(-4,6),t:rand(.4,.9)};
      scene.add(m); G.parts.push(m);
    }
  }
  function updateParts(dt){
    for(var i=G.parts.length-1;i>=0;i--){ var p=G.parts[i],u=p.userData;
      u.t-=dt; if(u.t<=0){ scene.remove(p); G.parts.splice(i,1); continue; }
      p.position.x+=u.vx*dt; p.position.y+=u.vy*dt; p.position.z+=u.vz*dt; u.vy-=20*dt;
      p.rotation.x+=dt*6; p.rotation.y+=dt*5;
    }
  }
  function crash(){
    if(G.state!=='playing') return;
    explode(G.player.x,1.2,0);
    gameOver();
  }

  /* ================= 流程控制 ================= */
  function startGame(){
    // 清理旧物体
    for(var i=G.objs.length-1;i>=0;i--){ release(G.objs[i].type,G.objs[i].mesh); }
    G.objs=[];
    for(i=G.parts.length-1;i>=0;i--) scene.remove(G.parts[i]); G.parts=[];
    if(G.player) scene.remove(G.player.group);
    G.totalDist=0; G.coins=0; G.speed=13; G.spawnCursor=22; G.laneFreeAt=[0,0,0];
    G.player=makePlayer();
    G.state='playing';
    document.getElementById('overlay').classList.add('hidden');
  }
  function gameOver(){
    G.state='gameover';
    var d=Math.floor(G.totalDist), isNew=d>G.high;
    if(isNew){ G.high=d; saveNum('neon_rush_high',d); }
    document.getElementById('end-dist').textContent=d;
    document.getElementById('end-coins').textContent=G.coins;
    document.getElementById('end-high').textContent=G.high;
    document.getElementById('new-record').style.display=isNew?'block':'none';
    showPanel('over');
  }
  function togglePause(){
    if(G.state==='playing'){ G.state='paused'; showPanel('pause'); }
    else if(G.state==='paused') resumeGame();
  }
  function resumeGame(){ G.state='playing'; document.getElementById('overlay').classList.add('hidden'); }
  function showPanel(n){
    document.getElementById('overlay').classList.remove('hidden');
    document.getElementById('panel-start').style.display=n==='start'?'block':'none';
    document.getElementById('panel-pause').style.display=n==='pause'?'block':'none';
    document.getElementById('panel-over').style.display=n==='over'?'block':'none';
  }
  function syncHud(){
    document.getElementById('dist').textContent=Math.floor(G.totalDist)+' m';
    document.getElementById('coins').textContent='● '+G.coins;
  }

  /* ================= 键盘 ================= */
  window.addEventListener('keydown',function(ev){
    var k=ev.key;
    if(k==='ArrowLeft'||k==='a'||k==='A'){ if(G.state==='playing')moveLane(-1); ev.preventDefault(); }
    if(k==='ArrowRight'||k==='d'||k==='D'){ if(G.state==='playing')moveLane(1); ev.preventDefault(); }
    if(k==='ArrowUp'||k==='w'||k==='W'||k===' '){ if(G.state==='playing')doJump(); ev.preventDefault(); }
    if(k==='ArrowDown'||k==='s'||k==='S'){ if(G.state==='playing')doSlide(); ev.preventDefault(); }
    if(k==='p'||k==='P'||k==='Escape'){ if(G.state==='playing'||G.state==='paused')togglePause(); }
    if(k==='Enter'&&(G.state==='start'||G.state==='gameover')) startGame();
  });

  /* ================= 触屏滑动 ================= */
  var tsX=0,tsY=0,tsT=0,tracking=false;
  var cv=renderer.domElement;
  cv.addEventListener('touchstart',function(ev){ var t=ev.changedTouches[0]; tsX=t.clientX;tsY=t.clientY;tsT=Date.now();tracking=true; },{passive:true});
  cv.addEventListener('touchend',function(ev){
    if(!tracking)return; tracking=false;
    var t=ev.changedTouches[0],dx=t.clientX-tsX,dy=t.clientY-tsY;
    if(G.state!=='playing')return;
    if(Math.abs(dx)>Math.abs(dy)){ if(Math.abs(dx)>28)moveLane(dx>0?1:-1); }
    else { if(dy<-28)doJump(); else if(dy>28)doSlide(); else if(Date.now()-tsT<250)doJump(); }
  },{passive:true});

  /* ================= 按钮 ================= */
  document.getElementById('btn-start').addEventListener('click',startGame);
  document.getElementById('btn-retry').addEventListener('click',startGame);
  document.getElementById('btn-resume').addEventListener('click',resumeGame);
  document.getElementById('btn-restart-p').addEventListener('click',startGame);
  document.getElementById('btn-pause').addEventListener('click',function(){ if(G.state==='playing'||G.state==='paused')togglePause(); });
  document.addEventListener('visibilitychange',function(){ if(document.hidden&&G.state==='playing')togglePause(); });

  /* ================= 自适应 / 后处理 ================= */
  function resize(){
    var ww=window.innerWidth, wh=window.innerHeight;
    renderer.setSize(ww,wh,false);
    camera.aspect=ww/wh; camera.updateProjectionMatrix();
    if(G.composer) G.composer.setSize(ww,wh);
    if(G.bloom) G.bloom.setSize(ww,wh);
  }
  window.addEventListener('resize',resize);
  window.addEventListener('orientationchange',function(){ setTimeout(resize,200); });

  // 后处理
  G.composer=new THREE.EffectComposer(renderer);
  G.composer.addPass(new THREE.RenderPass(scene,camera));
  G.bloom=new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth,window.innerHeight),0.62,0.42,0.82);
  G.composer.addPass(G.bloom);

  /* ================= 主循环 ================= */
  var last=performance.now();
  function loop(now){
    requestAnimationFrame(loop);
    var dt=Math.min((now-last)/1000,.033); last=now;
    try{
      if(G.state==='playing'){
        G.totalDist+=G.speed*dt;
        G.speed=Math.min(30,G.speed+dt*0.22);
        updatePlayer(dt); updateObjs(dt); updateScenery(dt); updateParts(dt);
      } else { updateParts(dt); }
    }catch(err){ console.error('更新异常：',err); }
    try{ G.composer.render(); syncHud(); }catch(err){ console.error('渲染异常：',err); }
  }

  initScenery();
  resize();
  showPanel('start');
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
